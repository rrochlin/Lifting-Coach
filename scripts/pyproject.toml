[project]
name = "liftimport"
version = "0.1.0"
description = "Translates external training logs into Lifting Coach's own language."
requires-python = ">=3.11"
# Standard library only, on purpose. This code is meant to lift into a Lambda
# with as little packaging as possible, and everything it does — CSV, JSON,
# sqlite3, zoneinfo, uuid — is already in the standard library.
dependencies = []

[project.scripts]
liftimport = "liftimport.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liftimport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
