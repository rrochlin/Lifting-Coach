# Ships `server/` to its three Lambdas: the one that indexes uploaded
# snapshots, the one that deletes an account, and the user pool's Sign in with
# Apple triggers. One package, three handlers — each function's handler
# setting (Terraform's) picks which entry point it runs.
#
# **This workflow updates code and never configuration.** Runtime, memory,
# timeout, architecture, handler, environment and the S3 trigger all belong to
# `terraform-infrastructure`, which owns the `aws_lambda_function` resource and
# carries `ignore_changes = [filename, source_code_hash]` so a code deploy from
# here doesn't read as drift there. That split is why `update-function-code` is
# called bare: passing `--architectures` would put a second owner on a field
# Terraform already owns, and the two would take turns changing it back.
#
# See `server/INFRA-SPEC.md` §5 and §7.
name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "!server/**.md" # a spec edit is not a code change
      - ".github/workflows/deploy-server.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "!server/**.md"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

permissions:
  id-token: write # OIDC, to assume the deploy role
  contents: read

env:
  # Pinned rather than read from a secret. There is one region in this design
  # (INFRA-SPEC §2) and an unset secret would expand to an empty string, which
  # fails in a way that names neither the secret nor the region.
  AWS_REGION: us-west-2
  # Space-separated. Every one must exist before this runs on main — the
  # Terraform that creates a function lands first, the code second.
  FUNCTION_NAMES: lift-coach-prod-index-snapshot lift-coach-prod-delete-account lift-coach-prod-apple-sign-in

# Two deploys of the same function must not race. Queued rather than
# cancelled: a half-finished code update is worse than a redundant one.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run the suite
        working-directory: server
        run: uv run pytest -q

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    # Pull requests run the tests above and stop there. Only main deploys, and
    # the deploy role's trust policy independently restricts it to
    # `refs/heads/main` — so this condition is a courtesy, not the control.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Runs only when something above it failed, which in practice means the
      # assume-role step. On the happy path it prints nothing and stays out of
      # every successful run's log, so it can't become noise people learn to
      # skim past.
      #
      # It exists because every way this can break — a renamed default branch, a
      # new repo, someone adding `environment:` to this job, a tag-triggered run
      # — produces the same generic "Not authorized to perform
      # sts:AssumeRoleWithWebIdentity", and sends the next person through the
      # same elimination by hand. The `sub` claim answers all of them at once.
      #
      # **It prints four claims and never the token.** That JWT is a bearer
      # credential: anyone holding it inside its validity window can assume any
      # role in any account whose trust policy accepts that subject, and Actions
      # logs are readable by anyone with repo read and persist afterwards. Do
      # not "improve" this by echoing the raw value.
      - name: Explain an OIDC failure
        if: failure()
        env:
          GH_REF: ${{ github.ref }}
          GH_EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail

          # Minted here rather than reused: configure-aws-credentials has
          # already failed by this point and exported nothing.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint in the environment."
            echo "That means this job lacks 'permissions: id-token: write' —"
            echo "which is the one failure this step would otherwise mis-explain."
            exit 0
          fi

          token="$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')"

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Could not mint an OIDC token to inspect."
            exit 0
          fi

          # base64url -> base64, then pad to a multiple of four.
          payload="$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')"
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="${payload}="; done
          claims="$(printf '%s' "$payload" | base64 -d 2>/dev/null)"

          echo "The role assumption failed. These are the claims GitHub sent:"
          # Bracketed so a trailing newline or a stray space in a pasted value
          # is visible rather than invisible — exactly the class of typo that
          # survives every other check.
          printf '  sub   [%s]\n' "$(printf '%s' "$claims" | jq -r '.sub')"
          printf '  aud   [%s]\n' "$(printf '%s' "$claims" | jq -r '.aud')"
          printf '  ref   [%s]\n' "$GH_REF"
          printf '  event [%s]\n' "$GH_EVENT"
          echo
          echo "The trust policy that must accept 'sub' is"
          echo "allowed_subject_patterns in terraform-infrastructure/lift-coach/main.tf"
          echo "— see server/INFRA-SPEC.md §7."
          echo
          echo "If 'sub' does match that pattern, then the ARN in the"
          echo "AWS_DEPLOY_ROLE_ARN secret points at a different role."

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build the package
        run: |
          set -euo pipefail
          # `liftcoach_server/` at the root of the archive. The deployed
          # handlers are `liftcoach_server.handlers.*`, and burying the package
          # one level down produces `Runtime.ImportModuleError: No module named
          # 'liftcoach_server'` — which is what the placeholder function failed
          # with, so it is a real mistake rather than a hypothetical one.
          rm -rf /tmp/package && mkdir -p /tmp/package
          cp -R server/src/liftcoach_server /tmp/package/

          # The one runtime dependency, `cryptography` (INFRA-SPEC §3.5), as
          # wheels for the *Lambda's* platform — arm64 Linux, Python 3.12 — not
          # this runner's. `--only-binary` because a source build here would
          # compile for x86_64 and fail at import in Lambda. boto3 is not
          # installed: every Lambda runtime ships it.
          uv export --project server --no-dev --no-hashes --no-emit-project -o /tmp/requirements.txt
          uv pip install --target /tmp/package -r /tmp/requirements.txt \
            --python-platform aarch64-manylinux_2_28 --python-version 3.12 --only-binary :all:

          cd /tmp/package
          zip -qr /tmp/function.zip . -x '*__pycache__*' '*.pyc' 'bin/*'
          unzip -l /tmp/function.zip | tail -1

      - name: Update the function code
        run: |
          set -euo pipefail
          # No `--architectures`, no configuration flags: Terraform owns those.
          # Nothing is vendored either — the package has no runtime
          # dependencies, and every Lambda runtime already ships boto3.
          for name in $FUNCTION_NAMES; do
            aws lambda update-function-code \
              --function-name "$name" \
              --zip-file fileb:///tmp/function.zip \
              --query 'FunctionName' --output text
            aws lambda wait function-updated-v2 --function-name "$name"
          done

      - name: Confirm the deployed bytes are the built bytes
        run: |
          set -euo pipefail
          # `update-function-code` returning 200 means AWS accepted the upload,
          # not that this build is what's now running. `CodeSha256` is the
          # base64 SHA-256 of the archive Lambda actually holds, so comparing it
          # against the file we just built turns "the API said yes" into
          # "the function is running this commit's code".
          expected="$(openssl dgst -sha256 -binary /tmp/function.zip | base64)"
          for name in $FUNCTION_NAMES; do
            actual="$(aws lambda get-function \
              --function-name "$name" \
              --query 'Configuration.CodeSha256' --output text)"

            if [ "$expected" != "$actual" ]; then
              echo "::error::$name: deployed code does not match the build."
              echo "  built:    $expected"
              echo "  deployed: $actual"
              exit 1
            fi
            echo "$name is running $expected"
          done
