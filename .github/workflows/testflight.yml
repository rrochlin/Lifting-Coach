# Builds the app and uploads it to TestFlight with the same script and the
# same signing as a Mac: `Tools/testflight.sh --upload`, the team's
# "Apple Distribution" certificate and the "LiftingCoach AppStore" profile
# (project.yml → Release), handed to the runner as secrets. Nothing here
# depends on an Apple ID being signed in, which is why Release signing is
# manual. Adapted from remodel-tracker's workflow, which shares the
# certificate.
#
# **Runs on every merge to main that changes the app, once CI has passed.**
# Every upload decides its marketing version, and on a merge project.yml is
# the decision (`testflight.sh --auto-version`): a merge that bumped
# MARKETING_VERSION ships a new release, any other ships another build of the
# current one. So the version is still chosen by a person — in the PR that
# bumps it — and nothing ships a version nobody picked.
#
# Triggered by CI completing rather than by the push itself, so a red main
# never reaches a phone. A merge that touches nothing the binary is built from
# (notes, server/, scripts/) is skipped: it would upload an identical app under
# a new build number.
#
# Actions → TestFlight → Run workflow still works, to ship a build by hand.
#
# Secrets (made 2026-10-04 from ~/.appstoreconnect/; the certificate and the
# profile both expire 2027-10-04):
#   IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD    certificate + private key
#   IOS_APPSTORE_PROFILE_BASE64                   the App Store profile
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64  App Store Connect API key
name: TestFlight

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "What this upload is"
        required: true
        type: choice
        options:
          - "new version (MARKETING_VERSION was bumped)"
          - "another build of the current version"

# One upload at a time: two runs would race for the same build number.
concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # On Ubuntu, so deciding to skip costs 1x minutes rather than a macOS runner.
  decide:
    runs-on: ubuntu-latest
    # A push to main that CI passed. CI's own `pull_request` runs never count,
    # and neither does a red one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    outputs:
      ship: ${{ steps.paths.outputs.ship }}
      sha: ${{ steps.paths.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - id: paths
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "ship=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A squash merge is one commit; a merge commit's first parent is main
          # before the merge. Either way HEAD^..HEAD is what the merge changed.
          changed=$(git diff --name-only HEAD^ HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(Sources/|LiftingCoachModel/Sources/|LiftingCoachModel/Package\.(swift|resolved)$|project\.yml$|Tools/testflight\.sh$|Tools/asc-latest-build\.py$|\.github/workflows/testflight\.yml$)'; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing the app is built from changed; no TestFlight build."
            echo "ship=false" >> "$GITHUB_OUTPUT"
          fi

  upload:
    needs: decide
    if: needs.decide.outputs.ship == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI passed, not whatever main has moved to since.
          ref: ${{ needs.decide.outputs.sha }}
          fetch-depth: 0 # the build number is the commit count

      - name: Select Xcode 26
        # Built with the iOS 26 SDK locally; the runner's default may be older.
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install signing certificate and profile
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: |
          # A throwaway keychain, unlocked for codesign without a prompt —
          # set-key-partition-list is what stops the "Always Allow" dialog a
          # runner has nobody to answer.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -base64 24)
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            echo "$PROFILE" | base64 --decode > "$dir/LiftingCoach_AppStore.mobileprovision"
          done

      - name: Install App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive, export and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [[ "${{ github.event_name }}" == workflow_run ]]; then
            Tools/testflight.sh --upload --auto-version
          elif [[ "$RELEASE" == another* ]]; then
            Tools/testflight.sh --upload --same-version
          else
            Tools/testflight.sh --upload
          fi

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf ~/.appstoreconnect
